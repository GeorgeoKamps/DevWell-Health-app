# DevWell — one-command local stack:  docker compose up --build
# Frontend:  http://localhost:8080
# API docs:  http://localhost:8000/docs
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Optional: set a key to enable real Claude responses; omit for mock mode.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes:
      - devwell-data:/data        # persists devwell.db + chroma_db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  devwell-data:
